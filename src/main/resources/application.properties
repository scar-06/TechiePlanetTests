spring.application.name=TechiePlanetTests

# Datasource — overridable via environment variables (docker-compose sets these).
# The fallbacks target a local PostgreSQL for development only.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studentscores}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Schema is created/updated by Hibernate for this assessment; a real production
# service would use versioned migrations (Flyway/Liquibase) instead — see README.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
